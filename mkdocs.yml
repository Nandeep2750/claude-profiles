site_name: claude-profiles
site_description: Run multiple Claude Code accounts on one machine - per-project accounts and session handoff.
site_url: https://Nandeep2750.github.io/claude-profiles/
repo_url: https://github.com/Nandeep2750/claude-profiles
repo_name: Nandeep2750/claude-profiles
edit_uri: edit/main/docs/
copyright: MIT licensed

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Add an account: guides/add-an-account.md
      - Per-project accounts: guides/per-project.md
      - Session handoff: guides/handoff.md
  - Reference:
      - Commands: commands.md
      - Settings: settings.md
      - Updating: updating.md
      - What's shared, what isn't: isolation.md
      - How it works: how-it-works.md
  - Troubleshooting: troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Nandeep2750/claude-profiles
