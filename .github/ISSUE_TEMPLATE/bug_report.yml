name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, and what you got instead.
      placeholder: |
        $ claude-profiles --live
        ...
    validations: { required: true }
  - type: textarea
    id: doctor
    attributes:
      label: Output of `claude-doctor`
      description: This covers your version, shell wiring and profile state in one go.
      render: text
    validations: { required: true }
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, WSL, Windows (PowerShell), Git-Bash, Other]
    validations: { required: true }
  - type: dropdown
    id: shell
    attributes:
      label: Shell
      options: [zsh, bash, PowerShell, fish, Other]
    validations: { required: true }
  - type: markdown
    attributes:
      value: |
        **Please do not paste credentials.** `claude-doctor` does not print
        tokens, but check any other output before posting.
