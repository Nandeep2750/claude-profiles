name: Feature request
description: Suggest something this should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is awkward today?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: A command, a flag, a behaviour - rough is fine.
    validations: { required: true }
